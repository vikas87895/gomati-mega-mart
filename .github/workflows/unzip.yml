name: Unzip File
on:
  push:
    paths:
      - '*.zip'
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Uncompress Archive
        run: |
          unzip my-file.zip -d extracted-folder/
          rm my-file.zip
      - name: Commit Files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Auto-unzipped file"
          git push
